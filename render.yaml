# Render Blueprint — ARTILLERY COMMAND
# Déploiement en un clic sur Render (Static Site, plan gratuit)
# Docs : https://render.com/docs/blueprint-spec
#
# Étapes :
#   1. Connectez votre compte GitHub à Render
#   2. New → Blueprint → sélectionnez ce dépôt
#   3. Render lit ce render.yaml et crée le service automatiquement
#   4. Le build génère un export statique dans ./out
#   5. Rendu servi via le CDN Render, accessible sur une URL publique

services:
  - type: web
    runtime: static
    name: artillery-command
    branch: main
    buildCommand: bun install && bun run build:static
    staticPublishPath: ./out
    plan: free
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    autoDeploy: true
    envVars: []
