# Render Blueprint — ARTILLERY COMMAND
# Déploiement en un clic sur Render (Static Site, plan gratuit)
# Docs : https://render.com/docs/blueprint-spec
#
# Étapes :
#   1. Connectez votre compte GitHub à Render
#   2. New → Blueprint → sélectionnez ce dépôt
#   3. Render lit ce render.yaml et crée le service automatiquement
#   4. Le build génère un export statique dans ./out
#   5. Rendu servi via le CDN Render, accessible sur une URL publique

services:
  - type: web
    name: artillery-command
    runtime: static
    # Branche à suivre
    branch: main
    # Répertoire contenant les fichiers statiques générés par `next build`
    rootDir: out
    # Commande de build
    buildCommand: bun install && bun run build:static
    # Répertoire à publier (relatif à rootDir)
    publish: .
    # Plan gratuit
    plan: free
    # Headers pour le cache et la sécurité
    headers:
      - path: /_next/static/*
        name: Cache-Control
        # Cache immuable pour les assets statiques (1 an)
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    # Auto-déploy à chaque push sur main
    autoDeploy: true
    # Variables d'environnement (aucune nécessaire — jeu 100% client-side)
    envVars: []
